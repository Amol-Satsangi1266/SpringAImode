spring.application.name=SpringAImode


spring.datasource.url=jdbc:h2:file:./data/dbchatmemory;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.ai.chat.memory.repository.jdbc.initialize-schema=always


spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# Fast, low-latency current Flash model (best for streaming)
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

